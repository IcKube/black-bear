<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Black Bear | Royal Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root, [data-theme="dark"] {
            --bg-color: #000000; --surface-color: #0a0a0a; --text-main: #ffffff;
            --text-muted: #737373; --accent-gold: #c5a059;
            --line-color: rgba(255, 255, 255, 0.08); --nav-bg: rgba(0, 0, 0, 0.8);
            --pill-bg: rgba(255, 255, 255, 0.03); --font-en: 'Plus Jakarta Sans', sans-serif;
            --font-heading-en: 'Playfair Display', serif;
        }
        [data-theme="light"] {
            --bg-color: #f8f9fa; --surface-color: #ffffff; --text-main: #0f172a;
            --text-muted: #64748b; --accent-gold: #b4904a;
            --line-color: rgba(0, 0, 0, 0.06); --nav-bg: rgba(248, 249, 250, 0.85);
            --pill-bg: rgba(0, 0, 0, 0.04);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-en); transition: 0.5s; }
        .top-btn { position: absolute; top: 28px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; z-index: 100; text-transform: uppercase; letter-spacing: 2px; font-size: 0.75rem; }
        .brand-logo { width: 140px; height: 140px; object-fit: contain; margin: 0 auto 2rem; display: block; }
        header { text-align: center; padding: 8vh 1.5rem 4vh; }
        h1 { font-family: var(--font-heading-en); font-size: 2.5rem; margin-bottom: 0.5rem; }
        .menu-container { max-width: 680px; margin: 0 auto; padding: 0 1.5rem 4rem; }
        .menu-item { display: flex; justify-content: space-between; padding: 2rem 0; border-bottom: 1px solid var(--line-color); align-items: center; }
        .item-name { font-weight: 500; font-size: 1.1rem; }
        .item-thumbnail { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; cursor: pointer; }
        
        /* ELITE AGENCY MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 100000; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: 0.4s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-hero { width: 100%; height: 55%; object-fit: cover; }
        .modal-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.5rem; }
        .modal-details { padding: 2rem; flex-grow: 1; }
        .modal-title { font-family: var(--font-heading-en); font-size: 2.5rem; margin-bottom: 1rem; }
        .modal-footer { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem 2rem; border-top: 1px solid #333; }
        .order-btn { background: var(--accent-gold); color: black; padding: 1rem 2rem; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <button class="top-btn theme-toggle" style="left: 28px;" onclick="cycleTheme()">THEME</button>
    <header>
        <img src="logo.png" alt="Logo" class="brand-logo">
        <h1 id="header-title">Black Bear</h1>
    </header>

    <main class="menu-container" id="menu-container"></main>

    <div id="image-modal" class="modal-overlay">
        <div class="modal-content" style="height:100%; display:flex; flex-direction:column;">
            <button class="modal-close" onclick="closeImageModal()">&times;</button>
            <img id="modal-image" class="modal-hero" src="" alt="Product">
            <div class="modal-details">
                <div id="modal-cat" style="color:var(--accent-gold); letter-spacing:3px; text-transform:uppercase; font-size:0.8rem;"></div>
                <div id="modal-title" class="modal-title"></div>
            </div>
            <div class="modal-footer">
                <div id="modal-price" style="font-size:1.5rem; font-weight:500;"></div>
                <button class="order-btn">ORDER NOW</button>
            </div>
        </div>
    </div>

    <script>
        const themes = ['dark', 'light']; let currentThemeIndex = 0;
        
        async function fetchAndRenderApp() {
            const response = await fetch('menu.json');
            const menuData = await response.json();
            const container = document.getElementById('menu-container');
            let html = '';
            menuData.forEach(item => {
                html += `
                    <div class="menu-item">
                        <div>
                            <div class="item-name">${item.name}</div>
                            <div style="color:var(--text-muted); font-size:0.9rem; margin-top:5px;">${item.price} IQD</div>
                        </div>
                        <img src="${item.image || ''}" class="item-thumbnail" onclick="openImageModal(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                    </div>`;
            });
            container.innerHTML = html;
        }

        function openImageModal(item) {
            document.getElementById('modal-image').src = item.image;
            document.getElementById('modal-cat').innerText = item.category;
            document.getElementById('modal-title').innerText = item.name;
            document.getElementById('modal-price').innerText = item.price + " IQD";
            document.getElementById('image-modal').classList.add('active');
        }
        function closeImageModal() { document.getElementById('image-modal').classList.remove('active'); }
        function cycleTheme() { currentThemeIndex = (currentThemeIndex + 1) % themes.length; document.documentElement.setAttribute('data-theme', themes[currentThemeIndex]); }
        fetchAndRenderApp();
    </script>
</body>
</html>
